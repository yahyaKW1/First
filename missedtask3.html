<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="missedtask3.css">
</head>
<body>

    <div class="game-container">
        <h1 class="title"><span class="blue-text">Character</span> Game</h1>    
        <p class="description">
            Write a function that take a sentence and a letter to search for it in the given sentence and return its locations in that sentence.
        </p>
        <div class="section input-section">
            <div class="badge green-badge">Input</div>
            <div class="inputs-wrapper">
                <div class="input-box string-box">
                    <label for="stringInput">String</label>
                    <input type="text" id="stringInput" value="This is javaScript">
                </div>
                <div class="input-box letter-box">
                    <label for="letterInput">Letter</label>
                    <input type="text" id="letterInput" maxlength="1" value="i">
                </div>
            </div>
        </div>
        <div class="section output-section">
            <div class="badge blue-badge">Output</div>
            <div class="output-box">
                <label>array</label>
                <div id="outputDisplay" class="output-display">[2, 5, 15]</div>
            </div>
        </div>
    </div>
    <script src="missedtask3.js"></script>
</body>
</html>
