<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="task14.css">
</head>
<body>

    <div class="container">
        <h2>Add Student Data</h2>
        
        <form id="studentForm" novalidate>
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" placeholder="Enter student name">
                <small class="error" id="nameError"></small>
            </div>
            <div class="form-group">
                <label for="age">Age:</label>
                <input type="number" id="age" placeholder="Enter age (> 18)">
                <small class="error" id="ageError"></small>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="example@domain.com">
                <small class="error" id="emailError"></small>
            </div>

            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" placeholder="At least 5 chars, A-z, 0-9">
                <small class="error" id="passwordError"></small>
            </div>

            <button type="submit">Add Student</button>
        </form>

        <h2>Student List</h2>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Email</th>
                </tr>
            </thead>
            <tbody id="studentTableBody">
            </tbody>
        </table>
    </div>

    <script src="task14.js"></script>
</body>
</html>
