<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="task13.css">
</head>
<body>
    <div class="slideshow-container">
        <div id="imgWrapper" class="img-wrapper">
            <img id="slide" src="" alt="Slideshow Image">
        </div>
        <div class="controls">
            <button id="prevBtn" class="btn yellow">&lt;</button>
            <button id="playBtn" class="btn green">Play</button>
            <button id="stopBtn" class="btn red">Stop</button>
            <button id="nextBtn" class="btn yellow">&gt;</button>
        </div>
    </div>
    <script src="task13.js"></script>
</body>
</html>
